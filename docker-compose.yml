services:
  bot:
    build: .
    container_name: upbit-paper-bot
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.50
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    environment:
      PAPER: ${PAPER:-true}
      STRATEGY_PATH: ${STRATEGY_PATH:-/app/strategies/sma_cross_btc.json}
      STATE_PATH: ${STATE_PATH:-/app/data/state.json}
      LOG_DIR: ${LOG_DIR:-/app/logs}
      POLL_SECONDS: ${POLL_SECONDS:-300}
      PAPER_CASH: ${PAPER_CASH:-1000000}
      FEE_RATE: ${FEE_RATE:-0.0005}
      ORDER_FRACTION: ${ORDER_FRACTION:-1.0}
      MAX_ORDER_KRW: ${MAX_ORDER_KRW:-0}
      MAX_DAILY_LOSS_KRW: ${MAX_DAILY_LOSS_KRW:-0}
      MAX_CONSECUTIVE_ERRORS: ${MAX_CONSECUTIVE_ERRORS:-5}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      UPBIT_ACCESS_KEY: ${UPBIT_ACCESS_KEY:-}
      UPBIT_SECRET_KEY: ${UPBIT_SECRET_KEY:-}
      LIVE_CONFIRM: ${LIVE_CONFIRM:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    volumes:
      - ./data:/app/data
      - ./strategies:/app/strategies:ro
      - ./logs:/app/logs
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from pathlib import Path; import time; p=Path('/app/logs/latest_status.txt'); assert p.exists() and time.time()-p.stat().st_mtime < 900",
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  desk:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: upbit-desk
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    expose:
      - "8080"
    environment:
      LOG_DIR: /app/logs
      STATE_PATH: /app/data/state.json
      RISK_PATH: /app/data/risk.json
      DASHBOARD_TOKEN: ${DASHBOARD_TOKEN:-}
      BASE_PATH: ${BASE_PATH:-/autotrade}
      PORT: "8080"
    volumes:
      - ./data:/app/data:ro
      - ./logs:/app/logs:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=5)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  edge:
    image: nginx:1.27-alpine
    container_name: upbit-edge
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.10
    ports:
      - "80:80"
      - "8080:80"
    volumes:
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - desk
    logging:
      driver: json-file
      options:
        max-size: "3m"
        max-file: "2"
