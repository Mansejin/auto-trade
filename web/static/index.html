<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AUTO-TRADE DESK</title>
  <script>
    (function () {
      var p = location.pathname;
      var base = p.endsWith("/") ? p : p.replace(/\/[^/]*$/, "/");
      if (p.indexOf("/autotrade") === 0) base = "/autotrade/";
      window.__DESK_BASE__ = base;
      document.write('<base href="' + base + '">');
    })();
  </script>
  <link rel="stylesheet" href="static/desk.css" />
</head>
<body>
  <div class="desk">
    <header class="topbar">
      <div class="brand-block">
        <span class="logo-mark" aria-hidden="true">AT</span>
        <div>
          <p class="eyebrow">AUTO-TRADE</p>
          <h1 class="brand">DESK</h1>
        </div>
        <span id="m-mode" class="pill">—</span>
      </div>
      <div class="top-meta">
        <span id="freshness" class="freshness" aria-live="polite">
          <span class="pulse" id="pulse"></span>
          <span id="fresh-text">갱신 대기</span>
        </span>
        <button type="button" class="ghost-btn" id="btn-refresh" title="지금 갱신">갱신</button>
        <a class="text-link" href="equity">자산</a>
        <form method="post" action="logout">
          <button class="text-btn" type="submit">로그아웃</button>
        </form>
      </div>
      <div id="halt-banner" class="halt-banner hidden" role="alert" hidden>
        <strong id="halt-title">거래 중단</strong>
        <span id="halt-detail"></span>
      </div>
      <div class="ticker-strip" aria-label="잔고 · 리스크" aria-live="polite">
        <div class="tick tick-pri"><span class="k">리스크</span><span class="v" id="m-risk">—</span></div>
        <div class="tick tick-sec" id="tick-xfer"><span class="k">이체</span><span class="v" id="m-xfer">—</span></div>
        <div class="tick-venue tick-pri">
          <span class="tick-venue-label">Upbit</span>
          <div class="tick"><span class="k">시그널</span><span class="v" id="m-signal">—</span></div>
          <div class="tick"><span class="k">원화</span><span class="v" id="m-krw">—</span></div>
          <div class="tick"><span class="k">포지션</span><span class="v" id="m-pos">—</span></div>
        </div>
        <div class="tick-venue tick-pri">
          <span class="tick-venue-label">Bitget</span>
          <div class="tick"><span class="k">시그널</span><span class="v" id="m-bg-signal">—</span></div>
          <div class="tick"><span class="k">USDT</span><span class="v" id="m-bitget">—</span></div>
          <div class="tick"><span class="k">포지션</span><span class="v" id="m-bg-pos">—</span></div>
        </div>
        <button type="button" class="tick-more" id="btn-ticker-more" aria-expanded="false">더보기</button>
      </div>
    </header>

    <section class="chart-plane" aria-label="차트">
      <div class="chart-chrome">
        <span id="chart-meta" class="chart-meta">—</span>
        <button type="button" class="text-btn" id="btn-chart-expand" aria-pressed="false">차트 크게</button>
      </div>
      <div id="tv_chart" class="chart-host"></div>
      <div id="chart-error" class="chart-error hidden" role="status"></div>
    </section>

    <section class="bottom">
      <div class="panel panel-sleeves">
        <div class="panel-head">
          슬리브 · 스위치
          <span class="panel-head-hint">장타=CORE · 단타=SCALP</span>
        </div>
        <div id="regime-strip" class="regime-strip" aria-live="polite"></div>
        <div id="sleeves-panel" class="sleeves" aria-live="polite"></div>
        <div class="panel-subhead">스위치 이력</div>
        <ul class="switch-hist" id="switch-hist"></ul>
        <p class="muted empty" id="switch-hist-empty">의미 있는 스위치 이력이 없습니다.</p>
      </div>

      <div class="panel panel-trades">
        <div class="panel-head row-head">
          <span>체결</span>
          <div class="seg-tabs" role="tablist" aria-label="체결 거래소">
            <button type="button" class="seg active" role="tab" aria-selected="true" data-tab="trades" data-target="ub">Upbit</button>
            <button type="button" class="seg" role="tab" aria-selected="false" data-tab="trades" data-target="bg">Bitget</button>
          </div>
        </div>
        <div class="tab-pane" data-pane="trades" data-for="ub">
          <ul class="trades" id="trades"></ul>
          <p class="muted empty" id="trades-empty">아직 기록된 체결이 없습니다.</p>
        </div>
        <div class="tab-pane hidden" data-pane="trades" data-for="bg">
          <ul class="trades" id="bg-trades"></ul>
          <p class="muted empty" id="bg-trades-empty">아직 기록된 체결이 없습니다.</p>
        </div>
      </div>

      <div class="panel panel-status">
        <div class="panel-head row-head">
          <span>상태</span>
          <div class="seg-tabs" role="tablist" aria-label="상태 거래소">
            <button type="button" class="seg active" role="tab" aria-selected="true" data-tab="status" data-target="ub">Upbit</button>
            <button type="button" class="seg" role="tab" aria-selected="false" data-tab="status" data-target="bg">Bitget</button>
          </div>
        </div>
        <div class="tab-pane" data-pane="status" data-for="ub">
          <div class="meters" id="ub-meters" hidden></div>
          <div class="status-block" id="latest-status">로딩…</div>
        </div>
        <div class="tab-pane hidden" data-pane="status" data-for="bg">
          <div class="meters" id="bg-meters" hidden></div>
          <div class="status-block" id="bg-latest-status">로딩…</div>
        </div>
      </div>
    </section>
  </div>
  <script src="static/desk.js"></script>
</body>
</html>
