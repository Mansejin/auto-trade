<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AUTO-TRADE DESK</title>
  <script>
    (function () {
      var p = location.pathname;
      var base = p.endsWith("/") ? p : p.replace(/\/[^/]*$/, "/");
      if (p.indexOf("/autotrade") === 0) base = "/autotrade/";
      window.__DESK_BASE__ = base;
      document.write('<base href="' + base + '">');
    })();
  </script>
  <link rel="stylesheet" href="static/desk.css" />
  <script src="https://s3.tradingview.com/tv.js"></script>
  <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
  <div class="desk">
    <header class="topbar">
      <div class="brand-block">
        <span class="logo-mark">AT</span>
        <div>
          <p class="eyebrow">AUTO-TRADE</p>
          <h1 class="brand">DESK</h1>
        </div>
        <span id="m-mode" class="pill">—</span>
      </div>
      <div class="ticker-strip" aria-label="봇 상태">
        <div class="tick"><span class="k">레짐</span><span class="v" id="m-regime">—</span></div>
        <div class="tick"><span class="k">CORE</span><span class="v" id="m-core">—</span></div>
        <div class="tick"><span class="k">SCALP</span><span class="v" id="m-scalp">—</span></div>
        <div class="tick"><span class="k">스위치</span><span class="v" id="m-switch">—</span></div>
        <div class="tick sep" aria-hidden="true"></div>
        <div class="tick"><span class="k">시그널</span><span class="v" id="m-signal">—</span></div>
        <div class="tick"><span class="k">원화</span><span class="v" id="m-krw">—</span></div>
        <div class="tick"><span class="k">포지션</span><span class="v" id="m-pos">—</span></div>
        <div class="tick"><span class="k">USDT</span><span class="v" id="m-bitget">—</span></div>
        <div class="tick"><span class="k">리스크</span><span class="v" id="m-risk">—</span></div>
      </div>
      <div class="top-meta">
        <div class="chart-toggle" role="group" aria-label="차트 종류">
          <button type="button" class="seg" data-chart="upbit" id="btn-upbit">업비트</button>
          <button type="button" class="seg" data-chart="tv" id="btn-tv">TradingView</button>
        </div>
        <span id="freshness" class="freshness"><span class="pulse" id="pulse"></span><span id="fresh-text">갱신 대기</span></span>
        <form method="post" action="logout">
          <button class="ghost-btn" type="submit">로그아웃</button>
        </form>
      </div>
    </header>

    <section class="chart-plane" aria-label="차트">
      <div class="chart-toolbar">
        <span id="chart-meta" class="chart-meta">—</span>
        <span class="chart-legend"><span class="lg-buy">▲ 매수</span><span class="lg-sell">▼ 매도</span></span>
      </div>
      <div id="upbit_chart" class="chart-host"></div>
      <div id="tv_chart" class="chart-host hidden"></div>
    </section>

    <section class="bottom">
      <div class="panel">
        <div class="panel-head">최근 체결</div>
        <ul class="trades" id="trades"></ul>
        <p class="muted empty" id="trades-empty">아직 기록된 체결이 없습니다.</p>
      </div>
      <div class="panel">
        <div class="panel-head">슬리브 · 스위치</div>
        <div id="sleeves-panel" class="sleeves" aria-live="polite"></div>
      </div>
      <div class="panel">
        <div class="panel-head">상태 로그</div>
        <pre class="status-pre" id="latest-text">로딩…</pre>
        <div class="panel-subhead">Bitget</div>
        <pre class="status-pre status-pre-sm" id="bg-latest-text">—</pre>
      </div>
    </section>
  </div>
  <script src="static/desk.js"></script>
</body>
</html>
