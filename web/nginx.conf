limit_req_zone $binary_remote_addr zone=desk_login:10m rate=1r/s;

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    client_max_body_size 2m;

    # ACME HTTP-01 renewals (certbot webroot)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location ~ ^(/autotrade)?/login$ {
        limit_req zone=desk_login burst=5 nodelay;
        proxy_pass http://desk:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /autotrade;
        proxy_hide_header X-Powered-By;
    }

    location / {
        proxy_pass http://desk:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /autotrade;
        proxy_hide_header X-Powered-By;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name autotrade-origin.mansejin.com;
    server_tokens off;
    client_max_body_size 2m;

    ssl_certificate     /etc/letsencrypt/live/autotrade-origin.mansejin.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/autotrade-origin.mansejin.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location ~ ^(/autotrade)?/login$ {
        limit_req zone=desk_login burst=5 nodelay;
        proxy_pass http://desk:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /autotrade;
        proxy_hide_header X-Powered-By;
    }

    location / {
        proxy_pass http://desk:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /autotrade;
        proxy_hide_header X-Powered-By;
    }
}
